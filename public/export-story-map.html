<!DOCTYPE html>
<html>
<head><title>Export Story Map</title></head>
<body style="background:#0f172a;color:#e2e8f0;font-family:monospace;padding:2rem">
<h2>📦 Story Map Export</h2>
<p>This page reads the story map from localStorage and displays it as JSON.</p>
<pre id="output" style="background:#1e293b;padding:1rem;border-radius:8px;overflow:auto;max-height:80vh;font-size:12px">Loading...</pre>
<script>
  const LS_KEY = 'fw-story-map-data';
  const raw = localStorage.getItem(LS_KEY);
  const el = document.getElementById('output');
  if (raw) {
    const data = JSON.parse(raw);
    const summary = {
      activities: data.activities?.length ?? 0,
      tasks: data.tasks?.length ?? 0,
      slices: data.slices?.length ?? 0,
      personas: data.personas?.length ?? 0,
      maps: data.maps?.length ?? 0,
    };
    el.textContent = JSON.stringify(data, null, 2);
    document.title = `Story Map: ${summary.activities}A / ${summary.tasks}T / ${summary.slices}S`;

    // Also expose for easy copy
    window.__storyMapData = data;
    console.log('Story map data:', summary);
    console.log('Full data available as window.__storyMapData');
  } else {
    el.textContent = 'No story map data found in localStorage.\nKey: ' + LS_KEY;
  }
</script>
</body>
</html>
